[package]
name = "mcp-caldav"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Enable the dump_raw_calendar_data MCP tool for debugging. Compiled out
# by default — build with `cargo build --features diagnostics` to include it.
diagnostics = []

[dependencies]
rmcp = { version = "1.3", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
quick-xml = { version = "0.37", features = ["serde", "serialize"] }
icalendar = "0.17"
rrule = "0.14"
moka = { version = "0.12", features = ["future"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# schemars is re-exported by rmcp
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
regex = "1"
